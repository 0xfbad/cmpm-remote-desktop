stages:
  - validate
  - privileged-e2e

# One fail-closed gate owns formatting, hadolint, shell syntax/shellcheck for
# every tracked shell entrypoint, full collector pytest coverage, destructive
# storage static guards, and a dry-run of the pinned ttyd patch.
validate:
  stage: validate
  image: nixos/nix:2.31.2@sha256:29fc5fe207f159ceb0143c25c19c774062fee02ce5eda118f3067547b3054894
  script:
    - nix --extra-experimental-features 'nix-command flakes' flake check --print-build-logs

# On the protected default branch and tags, this deliberately blocks a
# production pipeline until a privileged runner executes the same externally
# published endpoints students use. It is absent from feature/MR pipelines
# because the image is large and ordinary shared runners cannot safely expose
# nested Docker/nftables. `allow_failure: false` keeps the protected release
# pipeline blocked until this manual job succeeds.
image-and-network-e2e:
  stage: privileged-e2e
  image: docker:28.3.3-dind@sha256:a56b3bdde89315ed2cc0e4906e582b5033d93bf20d9cb9510c2cdd4e7f7690b1
  tags:
    - privileged-docker
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - apk add --no-cache bash curl openssh-client py3-cryptography python3
    # Run dockerd in this job's own privileged network/mount namespace. Thus
    # 127.0.0.1 published ports and collector socket bind paths are genuinely
    # reachable from the test client; a remote DinD service cannot provide
    # either property.
    - dockerd --host=unix:///var/run/docker.sock >/tmp/dockerd.log 2>&1 &
    - for i in $(seq 1 90); do docker info >/dev/null 2>&1 && break; sleep 1; done
    - docker info >/dev/null || { cat /tmp/dockerd.log; exit 1; }
  script:
    - |
      : "${UCSC_CA_CERT_FILE:?configure a protected GitLab file variable containing the course CA PEM}"
      : "${UCSC_CA_CERT_SHA256:?configure the independently verified course CA DER SHA-256}"
      test -r "$UCSC_CA_CERT_FILE"
    - >-
      docker build --pull --platform linux/amd64
      --secret id=ucsc_ca,src="$UCSC_CA_CERT_FILE"
      --build-arg UCSC_CA_CERT_SHA256="$UCSC_CA_CERT_SHA256"
      --build-arg OCI_REVISION="$CI_COMMIT_SHA"
      -t ctfd-remote-desktop:ci .
    - >-
      docker run --rm --env EXPECTED_CA_SHA256="$UCSC_CA_CERT_SHA256"
      --entrypoint /bin/bash ctfd-remote-desktop:ci -c
      'test -s /usr/local/share/ca-certificates/cmpm-sec-01.crt &&
      jq -e '\''any(.policies.Certificates.Install[];
      . == "/usr/local/share/ca-certificates/cmpm-sec-01.crt")'\''
      /usr/lib/firefox-esr/distribution/policies.json >/dev/null &&
      actual=$(openssl x509
      -in /usr/local/share/ca-certificates/cmpm-sec-01.crt -outform DER |
      sha256sum | awk '\''{print $1}'\'') &&
      test "$actual" = "$EXPECTED_CA_SHA256"'
    - >-
      docker run --rm --entrypoint curl ctfd-remote-desktop:ci
      --fail --silent --show-error --max-time 20 --output /dev/null
      https://cmpm-sec-01.acad.ucsc.edu/
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - when: never
